name: fcg-fase2

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fcg2-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fcg}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fcg_password}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - fcg2-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: fcg2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fcg_password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - fcg2-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fcg} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fcg2-rabbitmq-data:
  fcg2-postgres-data:
