# PostgreSQL unico com os tres databases dos servicos (fcg_users, fcg_catalog, fcg_payments).
# O Notifications nao tem banco. Os databases sao criados pelo script do ConfigMap postgres-init,
# que o entrypoint da imagem executa so na primeira inicializacao do volume.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: fcg
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fcg
type: Opaque
# Credenciais padrao de DESENVOLVIMENTO LOCAL (as mesmas do docker-compose.yml). Para qualquer outro
# ambiente, troque aqui e nas connection strings dos Secrets dos servicos.
stringData:
  POSTGRES_USER: fcg
  POSTGRES_PASSWORD: fcg_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: fcg
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fcg
data:
  01-create-databases.sql: |
    -- Um database por servico, todos no mesmo PostgreSQL. O Notifications nao tem banco.
    -- Scripts de /docker-entrypoint-initdb.d so rodam na primeira inicializacao do volume.
    -- Para recriar os databases, apague o PVC (kubectl delete pvc data-postgres-0 -n fcg).
    CREATE DATABASE fcg_users;
    CREATE DATABASE fcg_catalog;
    CREATE DATABASE fcg_payments;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fcg
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fcg
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fcg
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fcg
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: fcg
    spec:
      # Sem as variaveis POSTGRES_PORT=tcp://... que o Kubernetes injeta por padrao para cada Service.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            # Subpasta do volume: a raiz de um volume novo pode trazer lost+found, que o initdb recusa.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: fcg
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
